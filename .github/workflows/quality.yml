name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate without load
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run no-load quality gates
        id: quality
        run: npm run quality

      - name: Publish verification summary
        if: always()
        env:
          QUALITY_OUTCOME: ${{ steps.quality.outcome }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "## QuickPizza no-load quality gate"
            echo ""
            echo "- Result: ${QUALITY_OUTCOME}"
            echo "- Commit: ${COMMIT_SHA}"
            echo "- Checks: formatting, TypeScript, and Gatling package build"
            echo "- Target traffic: none"
            echo "- Gatling Cloud credits: none"
          } >> "$GITHUB_STEP_SUMMARY"
