name: Gatling Cloud baseline (manual)

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type RUN_THREE_CREDIT_BASELINE to authorize this run
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: quickpizza-gatling-cloud-run
  cancel-in-progress: false

jobs:
  baseline:
    name: Run one controlled three-minute baseline
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Validate explicit run confirmation
        env:
          RUN_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$RUN_CONFIRMATION" != "RUN_THREE_CREDIT_BASELINE" ]; then
            echo "Baseline rejected: confirmation value did not match."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run no-load quality gates
        run: npm run quality

      - name: Deploy and run the bounded baseline
        id: cloud_baseline
        env:
          GATLING_ENTERPRISE_API_TOKEN: ${{ secrets.GATLING_ENTERPRISE_API_TOKEN }}
        run: >-
          npx gatling enterprise-start
          --enterprise-simulation="QuickPizza - Anonymous Baseline"
          --non-interactive
          --wait-for-run-end
          --run-title="QuickPizza anonymous baseline - ${GITHUB_SHA::7}"
          --run-description="One journey per second for three minutes, two anonymous requests per journey"

      - name: Publish cloud-baseline summary
        if: always()
        env:
          RUN_OUTCOME: ${{ steps.cloud_baseline.outcome }}
          GATLING_RUNS_URL: https://cloud.gatling.io/o/pushpoint-co/simulations/test_jo8wmpyydirkuqnifpszu7rt3c/runs
        run: |
          {
            echo "## QuickPizza Gatling Cloud baseline"
            echo ""
            echo "- Result: ${RUN_OUTCOME}"
            echo "- Profile: one journey per second for three minutes"
            echo "- Target: https://quickpizza.grafana.com"
            echo "- Credit gate: quota must be checked before dispatch"
            echo "- Gatling runs: ${GATLING_RUNS_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
