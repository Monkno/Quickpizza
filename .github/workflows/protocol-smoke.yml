name: Protocol smoke (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quickpizza-protocol-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Run one bounded journey
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: performance

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run the two-request anonymous protocol smoke
        id: protocol_smoke
        run: npm run smoke

      - name: Upload the Gatling HTML report
        if: always()
        id: report_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gatling-protocol-smoke-${{ github.run_id }}
          path: target/gatling/
          if-no-files-found: error
          retention-days: 7

      - name: Publish protocol-smoke summary
        if: always()
        env:
          SMOKE_OUTCOME: ${{ steps.protocol_smoke.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.report_artifact.outcome }}
          ACTIONS_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## QuickPizza bounded protocol smoke"
            echo ""
            echo "- Result: ${SMOKE_OUTCOME}"
            echo "- Journey: one user, one iteration, two anonymous requests"
            echo "- HTML report artifact: ${ARTIFACT_OUTCOME}"
            echo "- Gatling Cloud credits: none"
            echo "- Workflow evidence: ${ACTIONS_RUN_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
